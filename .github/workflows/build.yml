name: Build & Release KasumiXposed

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty to use app version e.g. 1.3.4)'
        required: false
        default: ''

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Extract Version
        id: version
        run: |
          ver=$(grep -m1 'versionName' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || steps.version.outputs.version }}
          name: ${{ inputs.tag || steps.version.outputs.version }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
