name: Build & Release KasumiXposed

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (leave empty to use app version e.g. 1.3.4)'
        required: false
        default: ''

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Extract Version
        id: version
        run: |
          ver=$(grep -m1 'versionName' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Setup directories
        run: |
          mkdir -p /tmp/KasumiXposedbuild/apks
          mkdir -p /tmp/KasumiXposedbuild/tools

      - name: Move debug APK
        run: mv ./app/build/outputs/apk/debug/app-debug.apk /tmp/KasumiXposedbuild/apks/

      - name: Download uber-apk-signer
        run: wget -nv "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.2.1/uber-apk-signer-1.2.1.jar" -O /tmp/KasumiXposedbuild/tools/uber-apk-signer.jar

      - name: Sign release APK
        run: |
          if [ -f "./app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            java -jar /tmp/KasumiXposedbuild/tools/uber-apk-signer.jar --apks ./app/build/outputs/apk/release/app-release-unsigned.apk --out /tmp/KasumiXposedbuild/apks/
            mv /tmp/KasumiXposedbuild/apks/app-release-unsigned-aligned-debugSigned.apk /tmp/KasumiXposedbuild/apks/app-release.apk
          elif [ -f "./app/build/outputs/apk/release/app-release.apk" ]; then
            cp ./app/build/outputs/apk/release/app-release.apk /tmp/KasumiXposedbuild/apks/app-release.apk
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/KasumiXposedbuild/apks/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /tmp/KasumiXposedbuild/apks/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || steps.version.outputs.version }}
          name: ${{ inputs.tag || steps.version.outputs.version }}
          files: |
            /tmp/KasumiXposedbuild/apks/app-release.apk
            /tmp/KasumiXposedbuild/apks/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
