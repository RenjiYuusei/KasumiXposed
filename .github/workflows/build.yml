name: Build & Release KasumiXposed

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: |
          ATTEMPT=0
          until [ $ATTEMPT -ge 3 ]
          do
            ./gradlew build --no-daemon --stacktrace && break
            ATTEMPT=$((ATTEMPT+1))
            echo "Gradle build failed, retrying ($ATTEMPT/3)..."
            sleep 5
          done
          if [ $ATTEMPT -ge 3 ]; then
            echo "Gradle build failed after 3 attempts"
            exit 1
          fi

      - name: Setup directories
        run: |
          mkdir -p /tmp/KasumiXposedbuild/apks
          mkdir -p /tmp/KasumiXposedbuild/tools

      - name: Move debug APK
        run: mv ./app/build/outputs/apk/debug/app-debug.apk /tmp/KasumiXposedbuild/apks

      - name: Download uber-apk-signer
        run: wget -nv "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.2.1/uber-apk-signer-1.2.1.jar" -O /tmp/KasumiXposedbuild/tools/uber-apk-signer.jar

      - name: Sign release APK
        run: java -jar /tmp/KasumiXposedbuild/tools/uber-apk-signer.jar --apks ./app/build/outputs/apk/release/app-release-unsigned.apk --out /tmp/KasumiXposedbuild/apks/

      - name: Rename release APK
        run: mv /tmp/KasumiXposedbuild/apks/app-release-aligned-debugSigned.apk /tmp/KasumiXposedbuild/apks/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/KasumiXposedbuild/apks/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /tmp/KasumiXposedbuild/apks/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: KasumiXposed ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          files: |
            /tmp/KasumiXposedbuild/apks/app-release.apk
            /tmp/KasumiXposedbuild/apks/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
